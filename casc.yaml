jenkins:
  systemMessage: "This Jenkins instance is configured by the Configuration as Code plugin"
  securityRealm:
    local:
      allowsSignup: false
      users:
       - id: ${JENKINS_ADMIN_ID}
         password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    projectMatrix:
      entries:
        - group:
            name: "authenticated"
            permissions:
            - "Overall/Read"
            - "Job/Read"
            - "View/Read"
        - user:
            name: "admin"
            permissions:
            - "Overall/Administer"
        - user:
            name: "anonymous"
            permissions:
            - "Overall/Read"

  remotingSecurity:
    enabled: true

security:
  queueItemAuthenticator:
    authenticators:
    - global:
        strategy: triggeringUsersAuthorizationStrategy
unclassified:
  location:
    url: http://${NODE_URL}:8080/
